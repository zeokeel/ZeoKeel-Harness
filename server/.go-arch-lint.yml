# Go 架构判据（go-arch-lint v1.19.0，schema version 3）。
#
# 形态 = **基线即配置**：下面的 components/deps 就是 `server/cmd` + `server/internal`
# 的**当前真实包级 import 图**，机械生成（go/parser 只读 import 声明，不评估 build tag），
# 不是理想分层。首次运行必须 exit 0；判据只拦**新增**边。
# 规则、收紧流程与 mutation 自证见 docs/agent/architecture.md §3。
#
# 维护方式 = **增量**，不要整份重写：
#   - arch-go 报 `File ... not attached to any component` ⇒ 新增了包目录，补一个 component
#     （`in:` 是目录精确匹配，父目录不覆盖子目录；命名 = 目录去掉 internal/、/ 换 -）；
#   - arch-go 报 `Component X shouldn't depend on ...` ⇒ 要么改代码，要么按 §3 的
#     "新增一条边 = 改配置 + 评审" 在 deps.X.mayDependOn 里登记；
#   - 修掉一条不该有的依赖后立刻删对应行（配置本身就是回归判据）。
#
# 为什么 allow.deepScan=false：deepScan 会跑 go/packages 做"方法调用/依赖注入"级分析，
#   需要可写的 build cache 与完整模块下载，且会引入与声明式 import 图不一致的告警；
#   本判据只判包级 import 方向，所以关掉它（纯 go/parser + ImportsOnly）。
# 为什么 allow.depOnAnyVendor=true：本判据只管项目内分层，第三方依赖方向不在范围内。
#
version: 3
workdir: .

allow:
  depOnAnyVendor: true
  deepScan: false

excludeFiles:
  # 测试文件的 import 不进判据（基线只冻结生产构建的包级边）。
  # 代价：把测试 import 也算进来会多出 87 条存量边，其中 4 个测试侧 SCC
  # （docs/agent/architecture.md §3）；要连测试侧一起拦是另一次评审。
  - "^.*_test\\.go$"

exclude:
  # 只有 testdata/ 与几个不参与 server 构建的目录里有 .go 文件：
  # testdata 是 WASM 夹具/被编译进来的 guest 源码，不是 server 的包；
  # demoapps（WASM 演示应用）、scripts（mock-upstream）、skills（示例）、temp（本地缓存）同理。
  - temp
  - demoapps
  - scripts
  - skills
  - internal/wasmapp/**/testdata

