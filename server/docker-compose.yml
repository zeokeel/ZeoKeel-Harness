# ============================================================
# ZeoKeel Harness 服务端 Docker Compose 部署(单文件)
# ============================================================
# 本文件是完整 compose:caddy(反代+TLS) + server(ZeoKeel 服务端)
# + postgres(内置 PostgreSQL 18),一个文件直接部署:
#
#   cp .env.example .env && docker compose up -d
#
# .env 必填只有 4 个键(2026-10-23 口径;其余运行期配置在控制台「系统配置」页):
#   DOMAIN                 对外域名或 IP(默认示例值,生产必改)
#   TLS_MODE               证书模式(manual / auto / internal,见下)
#   ZEOKEEL_ADMIN_PASSWORD 首启超管密码(已有 admin 后幂等跳过,可置空清除明文)
#   PG_PASSWORD            内置 postgres 容器密码
# 服务端镜像标签 SERVER_IMAGE 可选(仅升级时需要)。
#
# server.environment 里的其它 ZEOKEEL_* 分两类,那段注释里逐组标了:
#   · 历史覆盖口 —— 已迁移到控制台「系统配置」页,**保留仅为兼容存量 .env**;
#     删任何一行都会让存量 .env 静默失效,所以它们不许被"顺手清理掉"。
#   · 有意不入库的部署旋钮(网络拓扑 / 连接池 / 迁移预算 / 镜像内路径)。
# 新部署**不需要**设置它们,默认值合理;控制台保存即生效(标注 restart 的键在
# `docker compose up -d server` 后生效)。
#
# 证书模式(由 .env 的 TLS_MODE 决定挂载哪个 Caddyfile 模板):
#   manual   → Caddyfile.manual   (自签占位/企业 CA;支持 IP)
#   auto     → Caddyfile.autocert (Let's Encrypt 自动;需公网域名直连)
#   internal → Caddyfile.internal (Caddy 本地 CA;纯内网开箱即用)
# 2026-09-10 修复:此前 compose 拼接的是 ./Caddyfile.internal,而仓库里 internal
# 模式的模板文件名是 Caddyfile —— TLS_MODE=internal 从未真正可用(挂载源不存在,
# caddy 容器创建即失败)。三种模式现统一为 Caddyfile.<mode> 命名。
#
# 服务与固定 IP(容器重建后不变):
#   caddy(172.28.0.2)  唯一对外入口,HTTPS 反代 + TLS 终结
#   server(172.28.0.3) ZeoKeel 服务端,仅 expose 8080 内网可达
#   postgres(172.28.0.4) 内置 PostgreSQL 18,不发布宿主机端口
#
# 数据目录(全部 ./ 当前目录 bind mount,升级不丢):
#   ./zeokeel-data  master.key + 应用数据(0700)
#   ./pg-data        PostgreSQL 数据(PG18 起容器内落 18/docker/ 子目录)
#   ./caddy-data     Caddy 自动证书库(auto 模式)
#   ./caddy-config   Caddy 配置
#   ./certs          手动证书(manual 模式,certs/server.crt + server.key)
# ============================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: zeokeel-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    # 按 TLS_MODE 选择 Caddyfile 模板(默认 manual);域名用 {$DOMAIN} 在
    # Caddyfile 内插值,模板内无需写死域名
    volumes:
      - ./Caddyfile.${TLS_MODE:-manual}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-zeokeel.example.com}
    networks:
      zeokeel-net:
        ipv4_address: ${CADDY_IP:-172.28.0.2}
    depends_on:
      server:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  server:
    image: ${SERVER_IMAGE:-zeokeel-harness-server:latest}
    container_name: zeokeel-server
    restart: unless-stopped
    # 仅内网可达(经 Caddy),不发布宿主机端口
    expose:
      - "8080"
    environment:
      # ==========================================================
      # 分组口径（2026-10-23，与 server/.env.example 同源）：
      #   ① 启动必需/引导       —— 没有它起不来，或只在首次启动时用到
      #   ② 网络拓扑（compose 层）—— 网段 / 固定 IP / 可信代理 / 对外地址
      #   ③ 历史覆盖口           —— 已迁移到控制台「系统配置」页；**保留仅为兼容存量
      #                            .env，新部署无需设置**（删掉任何一行 = 存量 .env
      #                            静默失效；判据见 cmd/server/compose_env_test.go
      #                            的 TestDeployconfigRegistryEnvsStayWired）
      #   ④ 仍留在 env 的部署旋钮 —— 有意不入库（连接池 / 迁移预算 / 镜像内路径），
      #                            理由见 docs/decisions/2026-10-23-db-backed-deployment-config.md
      # 所有取值保持 `${KEY:-}` 透传形态：写死默认值等于换一种方式无视 `.env`。
      # ==========================================================

      # ---- ① 启动必需/引导 ----
      # 初始管理员密码(已有 admin 时 EnsureBootstrapAdmin 幂等跳过,可置空以清除明文凭据)
      # ⚠ 首次启动必填,部署前改为强密码
      ZEOKEEL_ADMIN_PASSWORD: ${ZEOKEEL_ADMIN_PASSWORD:-}
      # 主密钥:留空则由服务端首次启动自动生成于 data/master.key(请备份)
      ZEOKEEL_MASTER_KEY: ${ZEOKEEL_MASTER_KEY:-}
      # 本部署所属渠道(beta / official / 品牌渠道 id)。
      #
      # **默认不设置**(`:-` 后面为空):渠道由**镜像自带的**声明决定
      # (Dockerfile 的 ARG CHANNEL → ENV ZEOKEEL_CHANNEL + /opt/zeokeel/CHANNEL)。
      # 这里若写死 `:-official`,就会覆盖镜像里的渠道 —— 渠道化镜像会被当成
      # 官方部署,进而接受官方清单把自己的品牌洗掉(最严重的一类错)。
      # 只有确实要覆盖镜像声明时才在 .env 里显式设置,且服务端会校验它与
      # 镜像内的渠道内容一致,不一致直接拒绝启动。
      ZEOKEEL_CHANNEL: ${ZEOKEEL_CHANNEL:-}

      # ---- ② 网络拓扑（compose 层；改网段/固定 IP 只改 .env，不要在编排里写死）----
      # 可信反向代理(审计 2026-08-25 F-02;R15C-03):使登录/MFA/OIDC 的限流键
      # 从 X-Forwarded-For 解析真实客户端 IP,防账号级 DoS。
      # **留空 = 从 CADDY_IP 派生** —— 网段与信任列表因此不可能漂移。
      # 宿主机已有别的反代(共享 Caddy/nginx)时才显式写它连过来的地址。
      ZEOKEEL_TRUSTED_PROXIES: ${ZEOKEEL_TRUSTED_PROXIES:-}
      # 前端 Caddy 在本私有网段里的固定 IP:与 services.caddy 的 ipv4_address
      # **同一个变量、同一份缺省**。服务端用它派生可信代理(上一条留空时),
      # 所以改网段只需改 CADDY_IP 一处(NETWORK_SUBNET 冲突时的既有做法)。
      CADDY_IP: ${CADDY_IP:-172.28.0.2}
      # 本服务端对外可达地址(如 https://harness.example.com)。
      # **首选在控制台「网关」页填写「对外访问地址」**;这里配了 env 优先(兼容存量部署,
      # 也是反代不设 X-Forwarded-Proto 时的确定性兜底)。留空则按请求推导
      # (X-Forwarded-Proto: https → TLS → 回环 http)。
      # 为什么要配:客户端更新清单里的下载地址必须是**绝对 https**,而客户端会
      # 丢弃非 https 的整份清单。判断不出协议时清单按设计拒发 client 段
      # (`client_unavailable`),表现为"检查更新永远说已是最新"。
      ZEOKEEL_PUBLIC_BASE_URL: ${ZEOKEEL_PUBLIC_BASE_URL:-}

      # ---- ③ 历史覆盖口（已迁移到控制台「系统配置」页;保留仅为兼容存量 .env,新部署无需设置）----
      # 这些键的**主入口是控制台**: 非空 env 仍然生效,但会压过控制台保存值,并在启动日志
      # 里被点名(deployconfig.LogStartupEnvOverrides)。每行注释里的 settings 键即控制台项。
      #
      # 更新清单地址(deploy.update_endpoint)。留空 = 本渠道默认目录;要**关闭**更新检查
      # 请在控制台填 off / none / - / disabled(留空不等于关闭)。
      ZEOKEEL_UPDATE_ENDPOINT: ${ZEOKEEL_UPDATE_ENDPOINT:-}
      # OIDC 登录回跳时额外信任的服务端主机名,逗号分隔(deploy.trusted_hosts)。
      ZEOKEEL_TRUSTED_HOSTS: ${ZEOKEEL_TRUSTED_HOSTS:-}
      # 单账号登录失败上限(auth.login_max_attempts,缺省 10)。仅测试环境才需要调大。
      ZEOKEEL_LOGIN_MAX_ATTEMPTS: ${ZEOKEEL_LOGIN_MAX_ATTEMPTS:-}
      # 放行**非回环明文** ldap://(auth.ldap_allow_plaintext,缺省拒绝)。
      # 目录服务不支持 LDAPS 时才开 —— bind 密码会明文过网,保存时日志大声告警。
      ZEOKEEL_LDAP_ALLOW_PLAINTEXT: ${ZEOKEEL_LDAP_ALLOW_PLAINTEXT:-}
      # 每用户 in-flight(并发)请求上限(gateway.max_inflight_per_user,缺省 32)。
      # **注意它不是"请求速率"限制**:速率上限是控制台「网关」页的 gateway.rate_limit。
      ZEOKEEL_GATEWAY_MAX_INFLIGHT_PER_USER: ${ZEOKEEL_GATEWAY_MAX_INFLIGHT_PER_USER:-}
      # 遥测上报限流(telemetry.*,缺省 60 / 10 / 10;0 = 不限,仅测试/压测)。
      ZEOKEEL_TELEMETRY_MAX_PER_MIN: ${ZEOKEEL_TELEMETRY_MAX_PER_MIN:-}
      ZEOKEEL_TELEMETRY_MAX_PER_SKILL_PER_MIN: ${ZEOKEEL_TELEMETRY_MAX_PER_SKILL_PER_MIN:-}
      ZEOKEEL_TELEMETRY_ERROR_REPORTING_MAX_PER_MIN: ${ZEOKEEL_TELEMETRY_ERROR_REPORTING_MAX_PER_MIN:-}
      # 审计哈希链周期校验间隔(audit.chain_interval,Go duration,缺省 1h;需重启)。
      ZEOKEEL_AUDIT_CHAIN_INTERVAL: ${ZEOKEEL_AUDIT_CHAIN_INTERVAL:-}
      # WASM 应用平台(员工自建应用;**应用只在桌面客户端内打开**,本栈不需要任何
      # 应用专用公网入口/域名/证书 —— 客户端协议 handler 转发到
      # POST /api/client/v2/apps/wasm/:app_id/request;升级需服务端与客户端同版本)。
      # 应用 id 的额外保留名(wasm.apps_extra_reserved,逗号分隔)。
      ZEOKEEL_APPS_EXTRA_RESERVED: ${ZEOKEEL_APPS_EXTRA_RESERVED:-}
      # 编译子进程隔离档(wasm.compile_isolation):require(生产推荐)/ auto(默认)/ off(仅测试)。
      ZEOKEEL_COMPILE_ISOLATION: ${ZEOKEEL_COMPILE_ISOLATION:-auto}
      # 应用平台内存档位(wasm.memory_profile):default(≈2.7 GiB)/ small(≈630 MiB)/
      # large(≈4.7 GiB)。**可用内存 < 约 4 GiB 的机器必须小档位**,否则启动自检
      # fail-closed、容器反复重启。首选在控制台改;这一行是"控制台进不去时"的逃生口
      # (启动闸门类配置写错就起不来,只有容器外的开关能救)。
      ZEOKEEL_WASM_MEMORY_PROFILE: ${ZEOKEEL_WASM_MEMORY_PROFILE:-}

      # ---- ④ 仍留在环境变量的部署旋钮（有意不入库，理由见决策文档）----
      # 数据库连接池上限(留空 = 服务端按实例数推导的默认;见 serverstore/db.go)。
      ZEOKEEL_DB_MAX_OPEN_CONNS: ${ZEOKEEL_DB_MAX_OPEN_CONNS:-}
      # 启动期迁移执行器的两条有界等锁预算与一条慢迁移告警阈值(毫秒;
      # 缺省 5min / 5min / 5s)。语义:预算打满即 fail-loud(点名迁移号 + SQLSTATE)
      # ⇒ 容器退出、旧实例继续服务("受得了失败、受不了挂住")。运维口径见
      # docs/06-database.md;写进 .env 真的会进容器(判据 compose_env_test.go)。
      ZEOKEEL_MIGRATION_LOCK_TIMEOUT_MS: ${ZEOKEEL_MIGRATION_LOCK_TIMEOUT_MS:-}
      ZEOKEEL_MIGRATION_ADVISORY_TIMEOUT_MS: ${ZEOKEEL_MIGRATION_ADVISORY_TIMEOUT_MS:-}
      ZEOKEEL_MIGRATION_SLOW_MS: ${ZEOKEEL_MIGRATION_SLOW_MS:-}
      # 内置技能资产目录(随镜像发布,缺省就是镜像内位置;换成宿主机目录时
      # 同时解开下面注释掉的 ./skills 挂载)。
      ZEOKEEL_SKILL_SEED_DIR: ${ZEOKEEL_SKILL_SEED_DIR:-/opt/zeokeel/skills}
      # 时区(日志与"按本地日"的账本口径)
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./zeokeel-data:/data
    # DSN 由 PG_PASSWORD 派生(compose 对 command 是整组替换,必须写全——
    # 含 bootstrap-admin);PG_PASSWORD 用 :? 强制必填,缺失时 compose 直接报错
    command: ["--bootstrap-admin", "${ADMIN_USER:-admin}", "-db-driver", "pg", "-pg-dsn", "postgres://zeokeel:${PG_PASSWORD:?PG_PASSWORD must be set in .env}@postgres:5432/zeokeel"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      zeokeel-net:
        ipv4_address: ${SERVER_IP:-172.28.0.3}
    healthcheck:
      # /healthz 无需认证返回 200;wget 退出码 0=healthy(连接失败/非200=unhealthy)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: ${PG_IMAGE:-postgres:18-alpine}
    container_name: zeokeel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeokeel
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: zeokeel
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # PG 18+ 官方镜像 PGDATA=/var/lib/postgresql/<major>/docker,
      # 挂载父目录 /var/lib/postgresql(容器内数据落 18/docker 子目录);
      # 旧挂载点 /var/lib/postgresql/data 会被 entrypoint 判定为
      # "unused mount/volume" 并拒绝启动(实测 exit 1)。
      - ./pg-data:/var/lib/postgresql
    networks:
      zeokeel-net:
        ipv4_address: ${PG_IP:-172.28.0.4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeokeel -d zeokeel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  zeokeel-net:
    name: zeokeel-net
    driver: bridge
    ipam:
      config:
        # 只指定子网;gateway 由 docker 自动取子网第一个可用 IP,避免手工不一致
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/24}
